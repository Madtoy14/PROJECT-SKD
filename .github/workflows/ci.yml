name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # ponytail: lint masih penuh debt pre-existing (react-hooks rules baru).
      # Gate keras = test + build + audit. Lint report-only sampai cleanup.
      - name: Lint (report)
        run: npm run lint
        continue-on-error: true

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build tidak butuh secret nyata; placeholder agar import env tidak kosong
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: public-anon-placeholder

      - name: Audit (high+)
        run: npm audit --audit-level=high
