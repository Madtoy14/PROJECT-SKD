  <text x="135" y="456" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#60A5FA">TWK</text>

  <rect x="204" y="430" width="110" height="40" rx="20" fill="#1E3A5F"/>
  <text x="259" y="456" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#60A5FA">TIU</text>

  <rect x="328" y="430" width="110" height="40" rx="20" fill="#1E3A5F"/>
  <text x="383" y="456" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#60A5FA">TKP</text>

  <rect x="452" y="430" width="160" height="40" rx="20" fill="#2D1B69"/>
  <text x="532" y="456" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#A78BFA">Try Out</text>

  <rect x="626" y="430" width="130" height="40" rx="20" fill="#1A2E1A"/>
  <text x="691" y="456" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#4ADE80">Survival</text>

